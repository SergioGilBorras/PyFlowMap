[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyflowmap"
version = "0.1.2"
description = "Deterministic Python activity-flow extraction with Mermaid, image export, and MCP"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "PyFlowMap contributors"}]
keywords = ["python", "mermaid", "static-analysis", "flowchart", "mcp"]
classifiers = ["Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only", "Topic :: Software Development :: Documentation"]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.10,<3"]
dev = ["pytest>=8", "ruff>=0.6"]
# GitHub tag dependency is OPTIONAL; Codex is never installed by default.
labeler = ["p4-semantic-labeler @ git+https://github.com/SergioGilBorras/P4-Semantic-Labeler.git@v0.1.0"]
labeler-codex = ["p4-semantic-labeler[codex] @ git+https://github.com/SergioGilBorras/P4-Semantic-Labeler.git@v0.1.0"]

[project.scripts]
pyflowmap = "pyflowmap.cli:main"
pyflowmap-mcp = "pyflowmap.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
# Preserve upstream P4 Git blobs byte-for-byte; these files are fixtures, not project code.
extend-exclude = ["tests/fixtures/references/**"]
