name: tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[dev,mcp]'
      - name: Install Graphviz renderer
        run: sudo apt-get update -qq && sudo apt-get install -y -qq graphviz
      - name: Test
        run: python -m pytest -q
      - name: Lint
        run: ruff check src tests

  linux-release-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Graphviz
        run: sudo apt-get update -qq && sudo apt-get install -y -qq graphviz
      - name: Install build tools
        run: python -m pip install -e '.[dev,mcp]'
      - name: Build, inspect, install and smoke-test the release
        run: python scripts/build_release.py --output "$RUNNER_TEMP/pyflowmap-release"
