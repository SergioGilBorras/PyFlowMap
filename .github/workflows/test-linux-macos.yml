name: PyFlowMap Linux and macOS

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-macos:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13']
        exclude:
          - os: macos-latest
            python-version: '3.12'

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Graphviz on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq graphviz

      - name: Install Graphviz on macOS
        if: runner.os == 'macOS'
        run: brew install graphviz

      - name: Install development and build dependencies
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e '.[dev,mcp]'

      - name: Unit and regression tests
        run: python -m pytest -q

      - name: Ruff
        shell: bash
        run: |
          if [ -d scripts ]; then
            ruff check src tests scripts
          else
            ruff check src tests
          fi

      - name: Build wheel and sdist
        run: python -m build --wheel --sdist --outdir dist

      - name: Smoke test wheel installed outside checkout
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel"
          venv="$RUNNER_TEMP/pyflowmap-wheel"
          python -m venv "$venv"
          "$venv/bin/python" -m pip install --upgrade pip
          "$venv/bin/python" -m pip install "${wheel}[mcp]"
          printf 'def demo(x):\n    if x > 0:\n        return 1\n    return 0\n' > "$RUNNER_TEMP/demo.py"
          cd "$RUNNER_TEMP"
          "$venv/bin/python" -m pip check
          "$venv/bin/python" -m pyflowmap.cli --help
          "$venv/bin/pyflowmap" --help
          "$venv/bin/pyflowmap" inspect "$RUNNER_TEMP/demo.py"
          "$venv/bin/pyflowmap" analyze "$RUNNER_TEMP/demo.py" --format all --renderer graphviz --output "$RUNNER_TEMP/diagrams"
          "$venv/bin/python" -c 'import pyflowmap.mcp_server; import importlib.metadata as m; print("Installed PyFlowMap:", m.version("pyflowmap"))'
          dot -V

  regression-banks:
    name: Verify all retained regression banks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Graphviz
        run: sudo apt-get update -qq && sudo apt-get install -y -qq graphviz

      - name: Install developer dependencies
        run: python -m pip install -e '.[dev,mcp]'

      - name: Execute 15-case cross-domain bank
        run: python -m benchmark.runners.run --render --output "$RUNNER_TEMP/baseline"

      - name: Execute eight control-flow regressions
        run: python -m benchmark.runners.run --cases-file benchmark/control-flow/cases.json --fixtures-root benchmark/control-flow/fixtures --render --output "$RUNNER_TEMP/control-flow"

      - name: Generate V1 bank and verify fixture hashes
        run: python benchmark/independent-v1/run.py --project-root "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/bank-v1"

      - name: Generate V2 bank and verify fixture hashes
        run: python benchmark/independent-v2/run.py --project-root "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/bank-v2"

      - name: Compare mock provider when the optional dependency is installed
        shell: bash
        run: |
          if python -c "import p4_semantic_labeler" >/dev/null 2>&1; then
            python scripts/compare_labeler_modes.py --output "$RUNNER_TEMP/labeler"
          else
            echo "NOT_VERIFIED: optional P4-Semantic-Labeler is not installed; injected-provider regression tests still run under pytest." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Archive short regression evidence
        uses: actions/upload-artifact@v4
        with:
          name: regression-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/baseline/report.json
            ${{ runner.temp }}/control-flow/report.json
            ${{ runner.temp }}/bank-v1/run-report.json
            ${{ runner.temp }}/bank-v2/run-report.json
            ${{ runner.temp }}/labeler/labeler-comparison.json
          if-no-files-found: error
          retention-days: 7

  release-package:
    name: Build verified wheel and sdist
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Graphviz
        run: sudo apt-get update -qq && sudo apt-get install -y -qq graphviz

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,mcp]'

      - name: Smoke-test the organized benchmark runners
        run: |
          python -m benchmark.runners.run --only cli --output "$RUNNER_TEMP/pyflowmap-benchmark-smoke"
          python benchmark/independent-v1/run.py --validate-only
          python benchmark/independent-v2/run.py --validate-only

      - name: Build allowlisted packages and clean-install smoke
        run: python scripts/build_release.py

      - name: Upload verified packages and SHA report
        uses: actions/upload-artifact@v4
        with:
          name: pyflowmap-release-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/release-build-report.json
          if-no-files-found: error
          retention-days: 14
