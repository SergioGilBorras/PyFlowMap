name: PyFlowMap Linux and macOS

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'release/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-macos:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.11', '3.13']

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Graphviz on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq graphviz

      - name: Install Graphviz on macOS
        if: runner.os == 'macOS'
        run: brew install graphviz

      - name: Install development and build dependencies
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e '.[dev,mcp]'

      - name: Unit and regression tests
        run: python -m pytest -q

      - name: Ruff
        shell: bash
        run: |
          if [ -d scripts ]; then
            ruff check src tests scripts
          else
            ruff check src tests
          fi

      - name: Build wheel and sdist
        run: python -m build --wheel --sdist --outdir dist

      - name: Smoke test wheel installed outside checkout
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel"
          venv="$RUNNER_TEMP/pyflowmap-wheel"
          python -m venv "$venv"
          "$venv/bin/python" -m pip install --upgrade pip
          "$venv/bin/python" -m pip install "${wheel}[mcp]"
          printf 'def demo(x):\n    if x > 0:\n        return 1\n    return 0\n' > "$RUNNER_TEMP/demo.py"
          cd "$RUNNER_TEMP"
          "$venv/bin/python" -m pip check
          "$venv/bin/python" -m pyflowmap.cli --help
          "$venv/bin/pyflowmap" --help
          "$venv/bin/pyflowmap" inspect "$RUNNER_TEMP/demo.py"
          "$venv/bin/pyflowmap" analyze "$RUNNER_TEMP/demo.py" --format all --renderer graphviz --output "$RUNNER_TEMP/diagrams"
          "$venv/bin/python" -c 'import pyflowmap.mcp_server; import importlib.metadata as m; print("Installed PyFlowMap:", m.version("pyflowmap"))'
          dot -V
